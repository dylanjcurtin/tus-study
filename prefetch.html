<script>
/* Fetch the other tabs in the background so switching between them is near-instant. */
(function () {
  function prefetch() {
    var seen = {};
    document.querySelectorAll('.navbar a.nav-link[href$=".html"]').forEach(function (a) {
      var href = a.href;
      if (seen[href] || href === location.href) return;
      seen[href] = true;
      var l = document.createElement('link');
      l.rel = 'prefetch'; l.href = href;
      document.head.appendChild(l);
    });
  }
  if ('requestIdleCallback' in window) requestIdleCallback(prefetch, { timeout: 2000 });
  else window.addEventListener('load', function () { setTimeout(prefetch, 500); });
})();
</script>
